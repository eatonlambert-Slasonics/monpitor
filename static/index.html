<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Raspberry Pi Wireless Monitor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #video {
            width: 90vw;
            max-height: 80vh;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
        #status {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9em;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #2ecc71;
            border: none;
            color: white;
            border-radius: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background: #27ae60;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            background: #e74c3c;
        }
        .connected .status-dot {
            background: #2ecc71;
        }
    </style>
</head>
<body>
    <div id="status-container">
        <span class="status-dot"></span>
        <span id="status">Disconnected</span>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <div class="controls">
        <button id="start">Cast Screen</button>
    </div>

    <script>
        var pc = null;

        function updateStatus(text, connected) {
            document.getElementById('status').innerText = text;
            document.getElementById('status-container').className = connected ? 'connected' : '';
        }

        function createPeerConnection() {
            var config = {
                sdpSemantics: 'unified-plan',
                iceServers: [{urls: ['stun:stun.l.google.com:19302']}]
            };

            pc = new RTCPeerConnection(config);

            pc.addEventListener('iceconnectionstatechange', function() {
                updateStatus(pc.iceConnectionState, pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed');
            });

            return pc;
        }

        async function start() {
            updateStatus('Requesting screen...', false);
            
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: "always"
                    },
                    audio: false
                });

                document.getElementById('video').srcObject = stream;
                pc = createPeerConnection();

                stream.getTracks().forEach(function(track) {
                    pc.addTrack(track, stream);
                });

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Wait for ICE gathering
                await new Promise(function(resolve) {
                    if (pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        function checkState() {
                            if (pc.iceGatheringState === 'complete') {
                                pc.removeEventListener('icegatheringstatechange', checkState);
                                resolve();
                            }
                        }
                        pc.addEventListener('icegatheringstatechange', checkState);
                    }
                });

                updateStatus('Connecting to Pi...', false);

                const response = await fetch('/offer', {
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type,
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    method: 'POST'
                });

                const answer = await response.json();
                await pc.setRemoteDescription(answer);
                
                document.querySelector('.controls').style.display = 'none';
            } catch (e) {
                updateStatus('Error: ' + e.message, false);
            }
        }

        document.getElementById('start').addEventListener('click', start);
    </script>
</body>
</html>
