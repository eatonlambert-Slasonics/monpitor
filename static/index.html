<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonPitor</title>
<style>
  :root { --bg:#111; --fg:#ddd; --dim:#888; --bar:#1f3a5f; --ok:#2ecc71; --warn:#e67e22; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:var(--size, 20px)/1.4 ui-monospace, Menlo, Consolas, monospace;
         height:100vh; display:flex; flex-direction:column; }
  header { background:var(--bar); padding:8px 12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; flex:1; min-width:200px; }
  header a { color:#fff; }
  .pill { font-size:12px; padding:2px 8px; border-radius:10px; background:rgba(255,255,255,.15); }
  .live { background:var(--ok); color:#000; }
  #note { color:var(--dim); padding:4px 12px; min-height:1.4em; }
  .size { display:flex; gap:4px; }
  .size button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:4px; padding:2px 8px; font:inherit; font-size:14px; cursor:pointer; }
  /* Same palette as the HDMI console (monpitor/style.py). */
  .k-time, .k-sep, .k-dim { color:var(--dim); }
  .k-name { color:#4fc3d9; }
  .k-tool { color:#e5c07b; }
  .k-says { color:#fff; font-weight:600; }
  .k-error { color:#ff6b6b; font-weight:600; }
  .k-warn { color:#e5c07b; }
  .k-ok { color:#5fd77f; font-weight:600; }
  .k-runner { color:#c678dd; }
  .k-start { color:#c678dd; font-weight:600; }
  .k-heading { color:#4fc3d9; font-weight:600; }
  .k-rule { color:#c678dd; }
  #log { flex:1; overflow:auto; margin:0; padding:8px 12px; white-space:pre-wrap; word-break:break-word; }
  /* Lines with a time column wrap under the text, not under the time. */
  #log .t { padding-left:10ch; text-indent:-10ch; }
  #fresh { font-size:13px; padding:2px 8px; border-radius:10px; background:rgba(255,255,255,.15); color:#fff; }
  #fresh.quiet { background:var(--warn); color:#000; font-weight:600; }
  #fresh:empty { display:none; }
  main { flex:1; display:flex; flex-direction:column; position:relative; min-height:0; }
  #latest { position:absolute; right:20px; bottom:16px; display:none; background:var(--bar); color:#fff;
            border:1px solid rgba(255,255,255,.3); border-radius:16px; padding:6px 14px; font:inherit; font-size:14px; cursor:pointer; }
  #latest.show { display:block; }
</style>
</head>
<body>
<header>
  <h1 id="title">MonPitor</h1>
  <span id="kind" class="pill">…</span>
  <span id="fresh" title="When the log last got a new line"></span>
  <span class="size"><button id="smaller" title="Smaller text">A−</button><button id="bigger" title="Bigger text">A+</button></span>
  <a id="castlink" href="/cast">Cast a screen</a>
</header>
<div id="note"></div>
<main><div id="log"></div><button id="latest">▼ Jump to latest</button></main>
<script>
  // Screen capture needs HTTPS, which MonPitor serves on port 8443.
  if (location.protocol === 'http:') document.getElementById('castlink').href = 'https://' + location.hostname + ':8443/cast';
  const logEl = document.getElementById('log');
  const latestBtn = document.getElementById('latest');
  const MAX = 3000;
  const QUIET = 10 * 60;   // same as QUIET_SECONDS in monpitor/style.py
  const RESUME_MS = 60000; // scrolled up and left alone this long: follow again

  // Stay on the newest line unless you scroll up to read. Then a button takes
  // you back, and after a minute without scrolling it follows again by itself.
  let follow = true, lastUserScroll = 0, autoScrolling = false;
  function atBottom() { return logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 40; }
  function toLatest() {
    follow = true;
    autoScrolling = true;
    logEl.scrollTop = logEl.scrollHeight;
    latestBtn.classList.remove('show');
  }
  logEl.addEventListener('scroll', () => {
    if (autoScrolling) { autoScrolling = false; return; }
    lastUserScroll = Date.now();
    follow = atBottom();
    latestBtn.classList.toggle('show', !follow);
  });
  latestBtn.onclick = toLatest;
  window.addEventListener('resize', () => { if (follow) toLatest(); });
  setInterval(() => {
    if (!follow && Date.now() - lastUserScroll > RESUME_MS) toLatest();
  }, 5000);

  // "last line 11:27:05 · 3m ago", from the Pi's clock so a wrong clock here doesn't matter.
  let activity = null, activityAt = '', isLive = false, skew = 0;
  const freshEl = document.getElementById('fresh');
  function ago(s) {
    s = Math.max(0, Math.floor(s));
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm';
    if (s < 86400) return Math.floor(s / 3600) + 'h ' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + 'm';
    return Math.floor(s / 86400) + 'd ' + Math.floor(s % 86400 / 3600) + 'h';
  }
  function showFresh() {
    if (!isLive) { freshEl.textContent = ''; return; }
    if (activity == null) { freshEl.textContent = 'no log lines yet'; freshEl.className = ''; return; }
    const age = (Date.now() / 1000 + skew) - activity;
    freshEl.textContent = 'last line ' + activityAt + ' · ' + ago(age) + ' ago';
    freshEl.className = age >= QUIET ? 'quiet' : '';
  }
  setInterval(showFresh, 1000);

  // Text size, remembered per browser.
  let size = 20;
  try { size = parseInt(localStorage.getItem('monpitor-size'), 10) || 20; } catch (e) {}
  function setSize(px) {
    size = Math.max(12, Math.min(48, px));
    document.body.style.setProperty('--size', size + 'px');
    try { localStorage.setItem('monpitor-size', size); } catch (e) {}
    if (follow) toLatest(); // bigger text makes the log taller; stay at the bottom
  }
  setSize(size);
  document.getElementById('smaller').onclick = () => setSize(size - 2);
  document.getElementById('bigger').onclick = () => setSize(size + 2);


  function addLine(text, spans) {
    const row = document.createElement('div');
    for (const [part, kind] of (spans || [[text, '']])) {
      if (!kind) { row.appendChild(document.createTextNode(part)); continue; }
      const el = document.createElement('span');
      el.className = 'k-' + kind;
      el.textContent = part;
      row.appendChild(el);
    }
    if (spans && spans.length && spans[0][1] === 'time') row.className = 't';
    if (!row.childNodes.length) row.appendChild(document.createTextNode('\u00a0'));
    logEl.appendChild(row);
    while (logEl.childNodes.length > MAX) logEl.removeChild(logEl.firstChild);
  }

  function showView(v) {
    document.getElementById('title').textContent = v.title;
    const kind = document.getElementById('kind');
    kind.textContent = v.casting ? 'casting' : v.kind;
    kind.className = 'pill' + (v.kind === 'live' ? ' live' : '');
    isLive = v.kind === 'live';
    activity = v.activity;
    activityAt = v.activity_at || '';
    skew = v.server_time - Date.now() / 1000;
    showFresh();
    document.getElementById('note').textContent =
      [v.note, v.state, v.repo_error && ('repo: ' + v.repo_error)].filter(Boolean).join('  ·  ');
  }

  function connect() {
    const es = new EventSource('/api/events');
    es.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.reset) { logEl.textContent = ''; activity = null; }
      if (m.view) showView(m.view);
      if (m.activity) { activity = m.activity; activityAt = m.activity_at || ''; showFresh(); }
      if (m.line !== undefined) addLine(m.line, m.spans);
      if (follow) toLatest();
    };
    es.onerror = () => { es.close(); setTimeout(connect, 3000); };
  }
  connect();
</script>
</body>
</html>
